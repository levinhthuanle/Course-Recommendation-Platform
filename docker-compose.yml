services:
  backend-deps:
    build:
      context: .
      dockerfile: Dockerfile.deps
    image: course-backend-deps:latest
    command: ["true"]
    restart: "no"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - meili_data:/meili_data
    expose:
      - "7700"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  meilisearch-init:
    image: curlimages/curl:8.10.1
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
    depends_on:
      meilisearch:
        condition: service_healthy
    command:
      - sh
      - -ec
      - >
        curl -sf -X PATCH "http://meilisearch:7700/experimental-features"
        -H "Authorization: Bearer $$MEILI_MASTER_KEY"
        -H "Content-Type: application/json"
        -d '{"compositeEmbedders":true}'
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: course-backend:latest
    environment:
      APP_NAME: ${APP_NAME:-Course Recommendation Platform}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      MEILISEARCH_URL: ${MEILISEARCH_URL:-http://meilisearch:7700}
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      MEILISEARCH_INDEX_NAME: ${MEILISEARCH_INDEX_NAME:-courses}
      RESOURCES_PATH: ${RESOURCES_PATH:-/app/Resources}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      SEARCH_LIMIT: ${SEARCH_LIMIT:-20}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-1440}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/course_db}
    expose:
      - "8000"
    depends_on:
      backend-deps:
        condition: service_completed_successfully
      meilisearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: course-frontend:latest
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-course_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-course_db} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  meili_data:
  postgres_data:
  frontend_node_modules: