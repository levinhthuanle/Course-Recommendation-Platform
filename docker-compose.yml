services:
  # Meilisearch Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: course_ir_meili
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=development
      - MEILI_EXPERIMENTAL_VECTOR_STORE=true
    volumes:
      - ./meili_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Dependencies Base Image (build once)
  backend-deps:
    build:
      context: .
      dockerfile: Dockerfile.deps
    image: course-backend-deps:latest
    # This service just builds the image, doesn't run

  # FastAPI Backend Service (fast rebuild)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: course-backend:latest
    container_name: course_ir_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Course Recommendation Platform
      - APP_VERSION=1.0.0
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILISEARCH_INDEX_NAME=courses
      - RESOURCES_PATH=/app/Resources
      - BATCH_SIZE=100
      - SEARCH_LIMIT=20
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - JWT_EXP_MINUTES=${JWT_EXP_MINUTES:-1440}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./Resources:/app/Resources
      - ./app:/app/app  # Mount code for developmewnt
    depends_on:
      backend-deps:
        condition: service_completed_successfully
      meilisearch:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: course_ir_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # PostgreSQL for persistent application data
  postgres:
    image: postgres:15-alpine
    container_name: course_ir_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_db || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: