name: CI/CD — Build, Push to GHCR and Deploy to EC2

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: "deploy-production"
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/course-backend:latest
            ${{ env.IMAGE_PREFIX }}/course-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/course-frontend:latest
            ${{ env.IMAGE_PREFIX }}/course-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 (pull prebuilt images)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for infra files)
        uses: actions/checkout@v4

      - name: Deploy: SSH to EC2 and pull images
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/course-platform || exit 1

            # Ensure we use the production compose file
            docker compose pull

            # Start with no local builds — rely on prebuilt images
            docker compose up -d

            # Health check (adjust endpoint/port as needed)
            sleep 8
            curl -f http://localhost:8000/health || exit 1

            echo "Production deploy finished"

      - name: Notify (optional)
        if: always()
        run: echo "Deploy job finished with status ${{ job.status }}"
