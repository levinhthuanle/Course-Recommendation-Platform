name: CI/CD - Build, Push to GHCR and Deploy to EC2

on:
  push:
    branches:
      - production
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: "deploy-production"
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  DEPLOY_DIR: /home/${{ secrets.EC2_USER }}/course-platform

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            image_tag="latest"
          fi

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend deps image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.deps
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend-deps:${{ steps.image-tags.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}/backend-deps:${{ steps.image-tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/course-backend:${{ steps.image-tags.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}/course-backend:${{ steps.image-tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/course-frontend:${{ steps.image-tags.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}/course-frontend:${{ steps.image-tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 (pull prebuilt images)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for infra files)
        uses: actions/checkout@v4

      - name: "Deploy: SSH to EC2 and pull images"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            REF_TYPE="${{ github.ref_type }}"
            REF_NAME="${{ github.ref_name }}"
            IMAGE_TAG="latest"
            if [ "$REF_TYPE" = "tag" ]; then
              IMAGE_TAG="$REF_NAME"
            fi

            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Deployment directory not found: $DEPLOY_DIR"
              echo "Run scripts/ec2-setup.sh once on the EC2 host to create it and clone the repo."
              exit 1
            fi

            cd "$DEPLOY_DIR" || exit 1
            if [ "$REF_TYPE" = "tag" ]; then
              git fetch --tags origin
              git checkout "$REF_NAME"
            else
              git fetch origin "$REF_NAME"
              git checkout "$REF_NAME"
              git pull --ff-only origin "$REF_NAME"
            fi

            if [ ! -f .env ]; then
              echo "Missing $DEPLOY_DIR/.env. Create it from .env.example and set production secrets."
              exit 1
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ${{ env.IMAGE_PREFIX }}/backend-deps:$IMAGE_TAG
            IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}" IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env -f docker-compose.prod.yml pull
            IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}" IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env -f docker-compose.prod.yml up -d

            sleep 8
            curl -f http://localhost/api/v1/health || exit 1

            echo "Production deploy finished"

      - name: Notify (optional)
        if: always()
        run: echo "Deploy job finished with status ${{ job.status }}"
