services:
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/levinhthuanle}/course-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - meilisearch
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/levinhthuanle}/course-frontend:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-course_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: 'true'
    expose:
      - "7700"
    volumes:
      - meili_data:/meili-data
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/ec2.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:
  meili_data:

networks:
  app-network:
    driver: bridge

