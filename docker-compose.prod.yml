services:
  meilisearch:
    environment:
      MEILI_ENV: production

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers
    environment:
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/course_db}
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      target: prod
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:3000:3000"
