version: '3.8'

services:
  backend:
    image: ghcr.io/levinhthuanle/course-backend:latest
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - meilisearch
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    image: ghcr.io/levinhthuanle/course-frontend:latest
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-course_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili-data
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/ec2.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:
  meili_data:

networks:
  app-network:
    driver: bridge

